name: Build Void Harbinger Mod (Fabric 1.20.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Initialize and make Gradle wrapper executable
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.7

      - name: Build Mod with Gradle Loom
        run: ./gradlew build --stacktrace

      - name: List build outputs
        run: ls -la build/libs/

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: void_harbinger-1.0.0
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
